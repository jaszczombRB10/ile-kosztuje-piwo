<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#233532" />
      <stop offset="100%" stop-color="#0b1312" />
    </radialGradient>
    <linearGradient id="beerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="neonShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#f97316" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#f97316" stroke-width="6" stroke-opacity="0.3" />

  <!-- Beer Icon with Neon Glow -->
  <g filter="url(#neonShadow)">
    <!-- Mug Handle -->
    <path d="M 330 210 H 370 C 410 210, 410 330, 370 330 H 330" fill="none" stroke="#e5e7eb" stroke-width="28" stroke-linecap="round" />
    
    <!-- Mug Body -->
    <rect x="150" y="180" width="180" height="200" rx="24" fill="url(#beerGrad)" stroke="#e5e7eb" stroke-width="16" />
    
    <!-- Foam Head -->
    <path d="M 140 180 C 140 150, 180 140, 200 160 C 220 135, 270 135, 290 160 C 310 145, 345 155, 340 180 Z" fill="#ffffff" />
    <circle cx="170" cy="165" r="14" fill="#ffffff" />
    <circle cx="240" cy="150" r="18" fill="#ffffff" />
    <circle cx="310" cy="165" r="14" fill="#ffffff" />

    <!-- Froth Drips -->
    <path d="M 180 180 Q 185 220 195 220 Q 205 220 205 180" fill="#ffffff" />
    <path d="M 270 180 Q 275 210 285 210 Q 295 210 295 180" fill="#ffffff" />

    <!-- Bubbles -->
    <circle cx="200" cy="300" r="7" fill="#ffffff" opacity="0.6" />
    <circle cx="230" cy="260" r="9" fill="#ffffff" opacity="0.7" />
    <circle cx="265" cy="310" r="6" fill="#ffffff" opacity="0.5" />
    <circle cx="280" cy="250" r="8" fill="#ffffff" opacity="0.6" />

    <!-- Currency Symbol Overlay Badge (zł) -->
    <circle cx="355" cy="380" r="54" fill="#13211f" stroke="#22c55e" stroke-width="8" />
    <text x="355" y="396" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="44" fill="#22c55e" text-anchor="middle">zł</text>
  </g>
</svg>
